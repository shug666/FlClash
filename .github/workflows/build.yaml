name: Build Linux .deb

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive
  TZ: Etc/UTC

jobs:
  build-linux-deb:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    timeout-minutes: 120

    steps:
      - name: Install base tools
        run: |
          apt-get update -y
          apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            xz-utils \
            zip \
            sudo \
            jq \
            ninja-build \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libkeybinder-3.0-dev \
            locate \
            rpm \
            patchelf \
            libfuse2 \
            clang \
            cmake \
            pkg-config \
            libglu1-mesa

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Activate flutter_distributor
        run: |
          dart pub global activate -s path plugins/flutter_distributor/packages/flutter_distributor

      - name: Build Linux .deb package
        run: |
          dart setup.dart linux --targets deb --env pre
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-linux-amd64-deb
          path: dist/**/**/*.deb
          if-no-files-found: error

      - name: List build output
        run: find dist -type f -name "*.deb" 2>/dev/null || echo "No .deb files found in dist/"